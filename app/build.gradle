plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hogan.removejobnotvpn'
    compileSdk 33

    defaultConfig {
        applicationId "com.hogan.removejobnotvpn"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
